name: MSVC Build Project

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 載入微軟 Visual Studio 的 cl.exe 編编译環境
      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      # 2. 正確的編譯指令：把 cha.c 和 sqlite3.c 綁在一起編譯
      - name: Compile C File
        run: |
          cl.exe cha.c sqlite3.c /D UNICODE /D _UNICODE /MD /O2 /Fe:cha.exe
          
      # 3. 收集並打包產出的 cha.exe 供你下載
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Exe-File
          path: cha.exe
